# Route A validation for the Vulkan EP plan:
# verify that the WebGPU EP over Dawn's Vulkan backend works end-to-end on Linux,
# using Mesa lavapipe (software Vulkan) so no physical GPU is required.
#
# Evidence chain:
#   1. vulkaninfo shows the lavapipe ICD (Vulkan runtime present).
#   2. ORT is built with --use_webgpu (Dawn Vulkan backend enabled).
#   3. strings(1) finds Vulkan/SPIR-V strings in libonnxruntime.so (backend compiled in).
#   4. WebGPU provider tests run with VK_ICD_FILENAMES pinned to lavapipe only, so a
#      green run proves WGSL -> SPIR-V -> Vulkan execution.
# Known limitation (pre-existing, not an ORT bug): the MatMul family crashes Mesa
# lavapipe's LLVM JIT, so MatMul/Attention tests are excluded here. See the
# webgpu-local-testing skill for details.
name: Vulkan Route A Validation

on:
  push:
    branches: [vulkan-validation]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  webgpu-over-vulkan-linux:
    name: WebGPU EP on Vulkan (lavapipe)
    # Pinned to 24.04: ubuntu-latest has migrated to Ubuntu 26 (GCC 15), whose libstdc++
    # <unicode> trips -Werror=maybe-uninitialized in logging.cc (a known GCC 15 false positive).
    # GCC 14 also matches the upstream manylinux build image toolchain.
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - name: Environment diagnostics
        run: |
          df -h
          echo "CPUs: $(nproc)"
          free -h
          cmake --version | head -1
          gcc --version | head -1
          python3 --version

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential gcc-14 g++-14 ninja-build python3-pip ccache unzip
          echo "CC=gcc-14" >> "$GITHUB_ENV"
          echo "CXX=g++-14" >> "$GITHUB_ENV"
          gcc-14 --version | head -1

      - name: Install software Vulkan stack (Mesa lavapipe)
        run: |
          sudo apt-get install -y --no-install-recommends \
            mesa-vulkan-drivers libvulkan1 vulkan-tools
          echo "=== Vulkan ICDs ==="
          ls -l /usr/share/vulkan/icd.d/
          echo "=== vulkaninfo --summary ==="
          vulkaninfo --summary

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: webgpu-vulkan-linux-v2
          max-size: 5G

      - name: Build ONNX Runtime with WebGPU EP (Dawn Vulkan backend)
        timeout-minutes: 300
        # --compile_no_warning_as_error: validation build, avoid -Werror false positives
        # --skip_tests: we run the WebGPU gtest subset manually in a later step
        run: |
          ./build.sh --config Release --parallel --use_webgpu --use_cache \
            --build_dir build/vulkan_val \
            --skip_tests \
            --compile_no_warning_as_error \
            --cmake_extra_defines onnxruntime_ENABLE_DAWN_BACKEND_VULKAN=ON

      - name: Post-build diagnostics
        run: |
          df -h
          ls -lh build/vulkan_val/Release/onnxruntime_provider_test
          ccache --show-stats || true

      - name: Verify Vulkan backend is compiled into the test binary
        # NOTE: default build has build_shared_lib=False, so scan the test binary,
        # which links Dawn (and its Vulkan backend) statically.
        run: |
          bin=build/vulkan_val/Release/onnxruntime_provider_test
          echo "Scanning: $bin"
          echo "--- Vulkan strings ---"
          strings "$bin" | grep -m 10 -i "vulkan" || echo "(no vulkan strings found)"
          echo "--- SPIR-V strings ---"
          strings "$bin" | grep -m 10 -iE "spirv|spv" || echo "(no spirv strings found)"

      - name: Count WebGPU test cases
        run: |
          cd build/vulkan_val/Release
          count=$(./onnxruntime_provider_test --gtest_list_tests | grep -c "WebGPU")
          echo "WebGPU test cases: $count"
          test "$count" -gt 0

      - name: Run WebGPU provider tests on Vulkan (exclude MatMul/Attention, lavapipe LLVM JIT limitation)
        timeout-minutes: 75
        # NOTE: Ubuntu's mesa package ships lvp_icd.json (no arch suffix); the
        # lvp_icd.x86_64.json name is Fedora/RHEL-style. Resolve dynamically and
        # re-verify vulkaninfo with the same env before running tests.
        run: |
          cd build/vulkan_val/Release
          ICD_JSON=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -1)
          echo "Using lavapipe ICD: $ICD_JSON"
          export VK_ICD_FILENAMES="$ICD_JSON"
          vulkaninfo --summary
          ./onnxruntime_provider_test \
            --gtest_brief=1 \
            --gtest_filter='*WebGPU*-*MatMul*:*Attention*'

      - name: Upload Linux test binary (for WSL GPU passthrough testing)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-webgpu-vulkan-testbin
          path: build/vulkan_val/Release/onnxruntime_provider_test
          retention-days: 7
          if-no-files-found: error

  # Windows build so the artifacts can run on a local Windows GPU machine
  # (GitHub-hosted runners have no GPU; the Linux job above produces ELF binaries).
  webgpu-vulkan-windows-build:
    name: WebGPU EP Windows build (local GPU test artifacts)
    runs-on: windows-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'  # match the local test machine

      - name: Environment diagnostics
        shell: cmd
        run: |
          cmake --version
          python --version

      - name: Build ONNX Runtime WebGPU wheel (Dawn Vulkan backend enabled)
        timeout-minutes: 330
        shell: cmd
        run: |
          python tools\ci_build\build.py --build_dir build\win_vulkan_val ^
            --config Release --parallel --use_webgpu --build_wheel ^
            --skip_tests --compile_no_warning_as_error ^
            --cmake_extra_defines onnxruntime_ENABLE_DAWN_BACKEND_VULKAN=ON

      - name: Upload wheel and provider test binary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-webgpu-vulkan-artifacts
          path: |
            build/win_vulkan_val/Release/dist/*.whl
            build/win_vulkan_val/Release/Release/onnxruntime_provider_test.exe
          retention-days: 7
          if-no-files-found: error
